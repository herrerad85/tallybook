apply plugin: 'com.android.application'

android {
    namespace "com.oriondev.moneywallet"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    androidResources {
        generateLocaleConfig true
    }

    defaultConfig {
        applicationId "io.github.herrerad85.tallybook"
        minSdk 24
        targetSdk 35
        versionCode 89
        versionName "1.11.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField('String', 'API_KEY_OPEN_EXCHANGE_RATES', ApiKey_OpenExchangeRates)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            vcsInfo {
                include false
            }
        }
        debug {
            applicationIdSuffix ".dev"
            debuggable true
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    // One flavor per dimension. The F-Droid recipe builds with gradle: [floss, osm] and copies
    // that list into every new version's build block, so both names stay.
    flavorDimensions "version", "map"
    productFlavors {
        floss {
            dimension "version"
        }
        osm {
            dimension "map"
        }
    }
    lint {
        baseline = file("lint-baseline.xml")
        abortOnError true
        // A baseline entry matches on the message text, and a MissingTranslation
        // message lists the locales a string is still missing from. Translating one
        // string rewrites that list, so the entry stops matching and the string is
        // reported fresh. At error severity that turns a translation contribution
        // into a red build, so this check reports without failing anything.
        warning "MissingTranslation"
        // These four ask a Google hosted index whether a dependency is flagged, so
        // their answer can change with no commit here. At error severity that means
        // a build that passed this morning can fail this afternoon on untouched code.
        // The last one is registered but never reported by this version of lint, and
        // is named so that a plugin bump cannot quietly put it back on the wire.
        warning "PlaySdkIndexVulnerability", "PlaySdkIndexNonCompliant",
                "PlaySdkIndexDeprecated", "PlaySdkIndexGenericIssues"
        // These three only report that a newer version exists. Each looks that up
        // over the network on every run and writes the answer into its message, so a
        // baseline entry for one stops matching as soon as that project ships.
        // AndroidGradlePluginVersion also sits on the root gradle wrapper, outside
        // this module, which is the one location a baseline cannot record portably.
        disable "AndroidGradlePluginVersion", "NewerVersionAvailable", "GradleDependency"
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

configurations {
    all {
        exclude module: 'commons-logging'
    }
}

dependencies {
    implementation libs.androidx.activity
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.biometric
    implementation libs.androidx.cardview
    implementation libs.androidx.collection
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.coordinatorlayout
    implementation libs.androidx.core
    implementation libs.androidx.documentfile
    implementation libs.androidx.drawerlayout
    implementation libs.androidx.fragment
    implementation libs.androidx.loader
    implementation libs.androidx.localbroadcastmanager
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.androidx.viewpager
    implementation libs.appintro
    implementation libs.commons.io
    implementation libs.glide
    implementation libs.itextpdf
    implementation libs.jxl
    implementation libs.lib.recur
    implementation libs.material
    implementation libs.material.about.library
    implementation libs.mpandroidchart
    implementation libs.okhttp
    implementation(libs.opencsv) {
        // Nothing on the path of the classes this app uses names either artifact. Those are
        // CSVReaderHeaderAware, CSVReader built through CSVReaderBuilder and
        // CSVParserBuilder, CSVParser, and CSVWriter, and the unit tests drive each of them
        // with the two artifacts left out, since the test classpath inherits these
        // exclusions. Taking the two artifacts out
        // drops about 480 KB from the release APK, which is not minified, so nothing else
        // would.
        exclude group: 'commons-beanutils'
        exclude group: 'org.apache.commons', module: 'commons-collections4'
    }
    implementation libs.patternlockview
    implementation libs.pinlockview
    implementation libs.zip4j
    // osm flavor
    osmImplementation libs.osmdroid
    // test dependencies (local tests)
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    // android test dependencies (on-device tests)
    androidTestImplementation libs.junit
    androidTestImplementation libs.androidx.test.runner
}
